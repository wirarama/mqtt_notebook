# Konfigurasi broker Mosquitto lokal (untuk belajar / pengembangan)
# Dijalankan oleh start_broker.bat

# MQTT standar, terbuka untuk semua antarmuka jaringan
# (ESP32/ESP8266 di jaringan yang sama bisa terhubung ke IP laptop ini)
listener 1883
allow_anonymous true

persistence false
log_dest stdout

# --- Opsional: MQTT over WebSocket (untuk dashboard web) ---
# Hapus tanda # pada dua baris di bawah untuk mengaktifkan
#listener 9001
#protocol websockets

# --- Opsional: wajib login (password) ---
# 1) Buat file: mosquitto\mosquitto_passwd.exe -c config\passwd namauser
# 2) Ganti allow_anonymous menjadi false, lalu aktifkan baris berikut:
#password_file config/passwd
